[package]
name = "ukhdk-listen"
version = "0.1.0"
edition = "2021"
description = "Terminal UI to edit the sealed built-in decks in src/words/vault.json, seal them and push with a three-way merge."
publish = false

[[bin]]
name = "ukhdk-listen"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
crossterm = "0.29"
getrandom = "0.3"
pbkdf2 = { version = "0.12", features = ["hmac"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"

[profile.release]
strip = true

# PBKDF2 with 600 000 rounds takes seconds unoptimised (the generic HMAC code is instantiated in this
# crate); tests derive real keys many times.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
